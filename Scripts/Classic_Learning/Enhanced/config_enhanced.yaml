# Enhanced Configuration for Radiomics Classification Pipeline

# Data paths
data:
  input_file: "~/reseng202500013-ndd-ml/data/radiomics_MRI_mri_labels.csv"
  output_dir: "~/reseng202500013-ndd-ml/data/enhanced_classical_results"

# Advanced preprocessing
preprocessing:
  # Missing value handling
  missing_values:
    strategy: "median"  # median, mean, most_frequent
  
  # Feature selection
  feature_selection:
    variance_threshold: 0.01
    mutual_info_k: 50
    f_statistic_k: 50
    combine_method: "union"  # union, intersection
  
  # Scaling
  scaling:
    method: "robust"  # robust, standard, minmax

# Data splitting
splitting:
  test_size: 0.2
  val_size: 0.2
  random_state: 42
  stratify: true

# Model configurations
models:
  # Random Forest with regularization
  RandomForest:
    enabled: true
    param_grid:
      n_estimators: [50, 100]
      max_depth: [3, 5, 7]
      min_samples_split: [10, 20]
      min_samples_leaf: [2, 4]
      max_features: ["sqrt", "log2"]
      class_weight: ["balanced"]
  
  # Logistic Regression with regularization
  LogisticRegression:
    enabled: true
    param_grid:
      C: [0.01, 0.1, 1.0, 10.0]
      penalty: ["l1", "l2"]
      solver: ["liblinear"]
      class_weight: ["balanced"]
  
  # SVM with regularization
  SVM:
    enabled: true
    param_grid:
      C: [0.1, 1.0, 10.0]
      kernel: ["rbf", "linear"]
      gamma: ["scale", "auto"]
      class_weight: ["balanced"]
  
  # Gradient Boosting with regularization
  GradientBoosting:
    enabled: true
    param_grid:
      n_estimators: [50, 100]
      max_depth: [3, 5]
      learning_rate: [0.01, 0.1]
      subsample: [0.8, 0.9]
      min_samples_split: [10, 20]
      min_samples_leaf: [2, 4]

# Cross-validation
cross_validation:
  cv_folds: 5
  scoring: "roc_auc"
  search_method: "randomized"  # randomized, grid
  n_iter: 20  # for RandomizedSearchCV

# Ensemble
ensemble:
  enabled: true
  method: "voting"  # voting, stacking
  voting_method: "soft"  # soft, hard

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc"]
  plots:
    model_comparison: true
    roc_curves: true
    feature_importance: true
    confusion_matrix: true
    performance_heatmap: true
    train_vs_test: true

# Output
output:
  save_models: true
  save_scaler: true
  save_feature_importance: true
  save_predictions: true
  plot_dpi: 300
  plot_format: "png"
  save_ensemble: true 