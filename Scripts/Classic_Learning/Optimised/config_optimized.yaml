# Optimized Configuration for Radiomics Classification Pipeline
# Focus: SVM as primary model with advanced feature engineering

# Data paths
data:
  input_file: "~/reseng202500013-ndd-ml/data/radiomics_MRI_mri_labels.csv"
  output_dir: "~/reseng202500013-ndd-ml/data/optimized_classical_results"
  binary_only: true
  random_state: 42

# Advanced feature engineering
feature_engineering:
  # Variance thresholding
  variance_threshold: 0.01
  
  # Polynomial features
  polynomial_degrees: [2, 3]
  polynomial_interaction_only: true
  
  # Family-based interactions
  enable_family_interactions: true
  radiomics_families:
    - "firstorder"
    - "glrlm"
    - "gldm"
    - "glszm"
    - "ngtdm"
  
  # Statistical summary features
  enable_statistical_features: true
  statistical_measures:
    - "percentile_25"
    - "percentile_75"
    - "percentile_90"
    - "skewness"
    - "kurtosis"
    - "range"
    - "iqr"
  
  # Top features for engineering
  top_features:
    - "original_glrlm_RunLengthNonUniformity"
    - "original_gldm_DependenceVariance"
    - "original_firstorder_Kurtosis"
    - "original_ngtdm_Busyness"
    - "original_glrlm_LongRunEmphasis"
    - "original_firstorder_RobustMeanAbsoluteDeviation"
    - "original_firstorder_Variance"
    - "original_firstorder_Mean"
    - "original_firstorder_Minimum"
    - "original_gldm_DependenceNonUniformity"
    - "original_glrlm_LongRunLowGrayLevelEmphasis"
    - "original_gldm_LargeDependenceEmphasis"
    - "original_glrlm_RunVariance"
    - "original_glszm_ZoneEntropy"
    - "original_firstorder_MeanAbsoluteDeviation"
  
  normalization:
    enabled: true
    z_score: true

# Feature selection
feature_selection:
  method: "rfecv"  # Recursive Feature Elimination with Cross-Validation
  cv_folds: 5
  scoring: "roc_auc"
  min_features: 10
  step: 1

# SVM optimization
svm_optimization:
  # Extended parameter grid
  param_grid:
    C: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
    gamma: ["scale", "auto", 0.001, 0.01, 0.1]
    kernel: ["linear", "rbf", "poly"]
    degree: [2, 3]  # for poly kernel
    class_weight: ["balanced", null]
    max_iter: [80000, 90000, 100000]  # Increased max iterations to 80k-100k
    tol: [1e-5, 1e-4, 1e-3]  # Reduced tolerance values
  
  # Cross-validation
  cv_folds: 5
  scoring: "roc_auc"
  search_method: "grid"  # grid, randomized
  n_iter: 50  # for RandomizedSearchCV

# Ensemble configuration
ensemble:
  enabled: true
  method: "voting"  # voting, stacking
  voting_method: "soft"  # soft, hard
  models:
    - name: "svm_linear"
      type: "svc"
      params:
        kernel: "linear"
        C: 1.0
        probability: true
      weight: 0.3
    
    - name: "svm_rbf"
      type: "svc"
      params:
        kernel: "rbf"
        C: 1.0
        gamma: "scale"
        probability: true
      weight: 0.3
    
    - name: "svm_optimized"
      type: "optimized"
      weight: 0.4

# Data splitting
splitting:
  test_size: 0.2
  val_size: 0.2
  random_state: 42
  stratify: true

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc"]
  plots:
    model_comparison: true
    roc_curves: true
    feature_importance: true
    confusion_matrix: true
    train_vs_test: true
    feature_engineering_summary: true

# Output
output:
  save_models: true
  save_scaler: true
  save_feature_importance: true
  save_feature_engineering: true
  plot_dpi: 300
  plot_format: "png"
  save_ensemble: true

# Clinical focus
clinical:
  interpretability: true
  feature_importance_threshold: 0.01
  confidence_threshold: 0.8
  save_predictions: true
  save_probabilities: true

# Stacking Ensemble Configuration
stacking_ensemble:
  # Base models
  base_models:
    svm_linear:
      type: "SVC"
      params:
        kernel: "linear"
        probability: true
        random_state: 42
    
    svm_rbf:
      type: "SVC"
      params:
        kernel: "rbf"
        probability: true
        random_state: 42
    
    random_forest:
      type: "RandomForestClassifier"
      params:
        n_estimators: 200
        max_depth: 10
        min_samples_split: 5
        min_samples_leaf: 1
        random_state: 42
    
    logistic_regression:
      type: "LogisticRegression"
      params:
        C: 1.0
        class_weight: "balanced"
        random_state: 42
        max_iter: 1000
  
  # Meta-learner
  meta_learner:
    type: "LogisticRegression"
    params:
      C: 1.0
      class_weight: "balanced"
      random_state: 42
      max_iter: 1000
  
  # Cross-validation for meta-learner
  cv: 5

# Additional selection methods
enable_mutual_info: true
mutual_info_k: 50
enable_f_statistic: true
f_statistic_k: 50

# Additional logging configuration
log_level: "INFO"
save_log: true

# Bayesian optimization and advanced models
bayesian_optimization:
  enabled: true
  iterations: 50
  method: "bayesian"  # "bayesian" or "grid"
  grid_search_cv: 5

# Advanced models
advanced_models:
  xgboost:
    enabled: true
    bayesian_iterations: 30
    cv_folds: 5
  lightgbm:
    enabled: true
    bayesian_iterations: 30
    cv_folds: 5

# Preprocessing configuration
preprocessing:
  scaler: "robust"  # "standard" or "robust"
  handle_missing: "median"  # "median", "mean", or "drop"
  remove_diagnostic: true

# Output configuration
output:
  save_model: true
  save_scaler: true
  save_feature_importance: true
  save_plots: true
  save_results: true
  save_config: true 