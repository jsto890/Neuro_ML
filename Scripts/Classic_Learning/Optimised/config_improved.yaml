# Improved Configuration for Radiomics Classification Pipeline
# Focus: Prevent overfitting, improve convergence, reduce data leakage

# Data paths
data:
  input_file: "~/reseng202500013-ndd-ml/data/radiomics_MRI_mri_labels.csv"
  output_dir: "~/reseng202500013-ndd-ml/data/improved_optimized_results"
  binary_only: true
  random_state: 42

# Improved feature engineering
feature_engineering:
  # Variance thresholding
  variance_threshold: 0.01
  
  # Conservative polynomial features
  polynomial_degrees: [2]  # Only degree 2
  polynomial_interaction_only: true
  
  # Improved outlier detection
  outlier_method: "iqr_3x"  # 3x IQR instead of 1.5x
  outlier_threshold: 3.0
  
  # Statistical summary features (only for top features)
  enable_statistical_features: true
  statistical_measures:
    - "texture_mean"
    - "texture_std"
  
  # Top features for engineering
  top_features:
    - "original_glrlm_RunLengthNonUniformity"
    - "original_gldm_DependenceVariance"
    - "original_firstorder_Kurtosis"
    - "original_ngtdm_Busyness"
    - "original_glrlm_LongRunEmphasis"
    - "original_firstorder_RobustMeanAbsoluteDeviation"
    - "original_firstorder_Variance"
    - "original_firstorder_Mean"
    - "original_firstorder_Minimum"
    - "original_gldm_DependenceNonUniformity"
    - "original_glrlm_LongRunLowGrayLevelEmphasis"
    - "original_gldm_LargeDependenceEmphasis"
    - "original_glrlm_RunVariance"
    - "original_glszm_ZoneEntropy"
    - "original_firstorder_MeanAbsoluteDeviation"
  
  normalization:
    enabled: true
    scaler: "robust"  # RobustScaler for better outlier handling

# Improved feature selection
feature_selection:
  method: "mutual_info_rfecv"  # Mutual information + RFECV
  mutual_info_k: 50  # Select top 50% of features
  rfecv_cv: 5
  rfecv_scoring: "roc_auc"
  min_features: 10
  step: 1

# Improved SVM optimization
svm_optimization:
  # Conservative parameter grid
  param_grid:
    C: [0.1, 1.0, 10.0, 50.0]  # Reduced upper bound
    gamma: ["scale", "auto"]
    kernel: ["linear", "rbf", "poly"]  # Removed poly kernel
    class_weight: ["balanced"]
    max_iter: [10000]  # Reduced max_iter
    tol: [1e-3]  # Increased tolerance
  
  # Cross-validation
  cv_folds: 5
  scoring: "roc_auc"  # Changed from accuracy to roc_auc
  search_method: "bayesian"
  n_iter: 30  # Reduced iterations

# Simplified ensemble configuration (prevent overfitting)
ensemble:
  enabled: true
  method: "stacking"
  base_models:
    - name: "svm_linear"
      type: "svc"
      params:
        kernel: "linear"
        C: 1.0  # Conservative C value
        probability: true
        max_iter: 10000
        tol: 1e-3
      weight: 0.3
    
    - name: "svm_rbf"
      type: "svc"
      params:
        kernel: "rbf"
        C: 1.0  # Conservative C value
        gamma: "scale"
        probability: true
        max_iter: 10000
        tol: 1e-3
      weight: 0.3
    
    - name: "logistic_regression"
      type: "logistic"
      params:
        C: 1.0
        class_weight: "balanced"
        max_iter: 1000
      weight: 0.4

# XGBoost with regularization (if used)
xgboost:
  enabled: true
  params:
    n_estimators: 100
    max_depth: 4  # Reduced depth
    learning_rate: 0.1
    subsample: 0.8  # Add regularization
    colsample_bytree: 0.8  # Add regularization
    reg_alpha: 0.1  # L1 regularization
    reg_lambda: 1.0  # L2 regularization
    eval_metric: "logloss"

# Data splitting
splitting:
  test_size: 0.2
  val_size: 0.2
  random_state: 42
  stratify: true

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc"]
  plots:
    model_comparison: true
    roc_curves: true
    feature_importance: true
    confusion_matrix: true
    train_vs_test: true
    overfitting_analysis: true

# Output
output:
  save_models: true
  save_scaler: true
  save_feature_importance: true
  save_feature_engineering: true
  plot_dpi: 300
  plot_format: "png"
  save_ensemble: true

# Clinical focus
clinical:
  interpretability: true
  feature_importance_threshold: 0.01
  confidence_threshold: 0.8
  save_predictions: true
  save_probabilities: true

# Meta-learner configuration
meta_learner:
  type: "LogisticRegression"
  params:
    C: 0.1  # Strong regularization
    class_weight: "balanced"
    max_iter: 1000

# Additional configuration
preprocessing:
  scaler: "robust"  # "standard" or "robust"
  handle_missing: "median"
  remove_diagnostic: true

# Logging configuration
log_level: "INFO"
save_log: true

# Bayesian optimization
bayesian_optimization:
  enabled: true
  iterations: 30  # Reduced iterations
  method: "bayesian"
  grid_search_cv: 5

# Output configuration
output:
  save_model: true
  save_scaler: true
  save_feature_importance: true
  save_plots: true
  save_results: true
  save_config: true 