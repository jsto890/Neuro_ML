# Project configuration template
# Update these paths for your local environment before running pipelines.

raw_data:
  smri: /path/to/data/raw/MRI
  pet: /path/to/data/raw/PET
  spect: /path/to/data/raw/SPECT

preprocessed_data:
  smri_p: /path/to/data/preprocessed/MRI/smriprep
  pet_p: /path/to/data/preprocessed/PET
  spect_p: /path/to/data/preprocessed/SPECT

templates:
  MRI_brain_mask: /path/to/Neuro_ML/Templates/MRI/MNI152_T1_1mm_brain.nii.gz
  PET_template: /path/to/Neuro_ML/Templates/PET/FDG-PET-template_padded.nii.gz
  PET_brain_mask: /path/to/Neuro_ML/Templates/PET/brain_in_petspace.nii.gz
  PET_cereb_mask: /path/to/Neuro_ML/Templates/PET/cereb_in_petspace.nii.gz
  SPECT_occipital: /path/to/Neuro_ML/Templates/SPECT/occipital_mask.nii.gz
  SPECT_template: /path/to/Neuro_ML/Templates/SPECT/symFPCITtemplate_MNI_norm.nii